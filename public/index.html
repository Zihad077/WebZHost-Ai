<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081521">
<meta name="description" content="WebZHost AI support assistant">
<title>WebZHost AI</title>
<style>
:root{color-scheme:dark;--bg:#081521;--panel:#102536;--panel2:#0c1e2d;--line:#234052;--text:#edf7fc;--muted:#9bb1bf;--blue:#20b8e5;--teal:#36d6d0;--danger:#ff8c8c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#16415a 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center}
main{width:min(850px,100%);min-height:100dvh;display:flex;flex-direction:column;padding:clamp(12px,3vw,24px);padding-bottom:max(12px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;padding:8px 2px 17px;border-bottom:1px solid var(--line)}.logo{width:44px;height:44px;flex:none;border-radius:14px;background:linear-gradient(135deg,var(--teal),var(--blue));display:grid;place-items:center;color:#06202b;font-weight:900;font-size:21px;box-shadow:0 7px 24px #20b8e52b}h1{font-size:18px;line-height:1.2;margin:0}header p{font-size:12px;color:var(--muted);margin:4px 0 0}.head-actions{margin-left:auto;display:flex;align-items:center;gap:8px}.status{font-size:11px;color:#9de5c1;border:1px solid #28583f;padding:5px 9px;border-radius:20px;white-space:nowrap}.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:7px 10px;cursor:pointer}
#chat{flex:1;min-height:260px;overflow:auto;padding:22px 2px;display:flex;flex-direction:column;gap:13px;scroll-behavior:smooth}.welcome{margin:auto;text-align:center;max-width:440px;color:var(--muted);font-size:13px;padding:24px}.welcome strong{display:block;color:var(--text);font-size:17px;margin-bottom:7px}.msg{max-width:min(88%,680px);padding:12px 14px;border:1px solid var(--line);border-radius:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.bot{align-self:flex-start;background:var(--panel)}.user{align-self:flex-end;background:#123a50;border-color:#28617a}.meta{font-size:10px;color:var(--muted);margin-top:7px}.error{color:var(--danger)}
form{display:flex;gap:9px;padding-top:12px;border-top:1px solid var(--line)}textarea{flex:1;resize:none;min-height:49px;max-height:130px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--text);padding:13px;font:inherit;outline:none}textarea:focus{border-color:var(--blue)}button.send{border:0;border-radius:13px;padding:0 19px;background:var(--blue);color:#05202b;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.hint,footer{text-align:center;color:var(--muted);font-size:11px;padding-top:9px}.hint{padding-top:7px}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
@media(max-width:520px){main{padding:12px}.status{display:none}.msg{max-width:94%}button.send{padding:0 15px}}
</style>
</head>
<body><main>
<header><div class="logo">W</div><div><h1>WebZHost AI</h1><p>WebZHost support · English & Bangla</p></div><div class="head-actions"><span class="status" id="status">● Checking</span><button class="icon-btn" id="clear" type="button" aria-label="Clear chat">Clear</button></div></header>
<section id="chat" aria-live="polite"><div class="welcome"><strong>How can I help?</strong>Ask about WebZHost, project setup, hosting, uploads, documentation or troubleshooting.</div></section>
<form id="form"><textarea id="input" maxlength="1200" rows="1" placeholder="Ask about WebZHost…" aria-label="Your question" required></textarea><button class="send" id="send" type="submit">Send</button></form>
<div class="hint">Enter to send · Shift + Enter for a new line</div>
<footer>Experimental self-hosted model · No external AI API · <a href="https://webzhost.vercel.app/docs" target="_blank" rel="noopener noreferrer">Official documentation ↗</a></footer>
</main>
<script>
const chat=document.querySelector('#chat'),form=document.querySelector('#form'),input=document.querySelector('#input'),send=document.querySelector('#send'),statusEl=document.querySelector('#status');
function add(text,who,meta=''){const el=document.createElement('div');el.className='msg '+who;const body=document.createElement('div');body.textContent=text;el.append(body);if(meta){const info=document.createElement('div');info.className='meta';info.textContent=meta;el.append(info)}chat.append(el);chat.scrollTop=chat.scrollHeight;return {el,body};}
async function checkHealth(){try{const r=await fetch('/api/health',{cache:'no-store'});const d=await r.json();statusEl.textContent=d.ok?'● Online':'● Unavailable';statusEl.style.color=d.ok?'#9de5c1':'#ff8c8c'}catch{statusEl.textContent='● Offline';statusEl.style.color='#ff8c8c'}}
form.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message||send.disabled)return;const welcome=chat.querySelector('.welcome');if(welcome)welcome.remove();add(message,'user');input.value='';input.style.height='auto';send.disabled=true;const waiting=add('Preparing the model and generating a reply…','bot');const started=Date.now();
try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});let data;try{data=await response.json()}catch{throw new Error('The server returned an invalid response. Check the Vercel deployment logs.')}
if(!response.ok||!data.ok){waiting.body.textContent=data.error||'The AI request failed.';waiting.body.classList.add('error');const detail=data.details||data.phase;if(detail){const m=document.createElement('div');m.className='meta';m.textContent=String(detail).slice(0,500);waiting.el.append(m)}}else{waiting.body.textContent=data.answer||'No answer was returned.';const total=data.timingsMs?.total??(Date.now()-started);const m=document.createElement('div');m.className='meta';m.textContent=`${(total/1000).toFixed(1)}s · ${data.source||'AI response'}`;waiting.el.append(m)}}catch(err){waiting.body.textContent=err.message||'Could not reach the AI server.';waiting.body.classList.add('error')}finally{send.disabled=false;input.focus();chat.scrollTop=chat.scrollHeight}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px'});document.querySelector('#clear').addEventListener('click',()=>{chat.innerHTML='<div class="welcome"><strong>How can I help?</strong>Ask about WebZHost, project setup, hosting, uploads, documentation or troubleshooting.</div>';input.focus()});checkHealth();
</script></body></html>
